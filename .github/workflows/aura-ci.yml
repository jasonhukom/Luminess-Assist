name: AURA Feature Branch Build

on:
  push:
    branches:
      - feat/aura-boot-onboarding
      - feat/persistent-companion-personality
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
